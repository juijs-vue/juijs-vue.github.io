name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site source lives in THIS repo now (web/, gallery/, play/, lib/, res/) - only
      # the 5 not-yet-published-to-npm library dependencies (consumed via "file:../../<name>"
      # links from web/package.json) still need to be checked out as siblings, in dependency
      # order, exactly like local development already expects them to sit next to each other
      # on disk. Checked out to `site/` (not the workspace root) so those relative "../../"
      # links still resolve correctly against the sibling checkouts below.
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-core-ts
          path: jui-core-ts

      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-graph-ts
          path: jui-graph-ts

      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-chart-vue
          path: jui-chart-vue

      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-ui-vue
          path: jui-ui-vue

      - uses: actions/checkout@v4
        with:
          repository: juijs-vue/jui-grid-vue
          path: jui-grid-vue

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            jui-core-ts/package-lock.json
            jui-graph-ts/package-lock.json
            jui-chart-vue/package-lock.json
            jui-ui-vue/package-lock.json
            jui-grid-vue/package-lock.json
            site/web/package-lock.json

      - name: Build jui-core-ts (local dependency)
        working-directory: jui-core-ts
        run: |
          npm ci
          npm run build

      - name: Build jui-graph-ts (local dependency, depends on jui-core-ts)
        working-directory: jui-graph-ts
        run: |
          npm ci
          npm run build:lib

      - name: Build jui-chart-vue (local dependency, depends on jui-graph-ts)
        working-directory: jui-chart-vue
        run: |
          npm ci
          npm run build:lib

      - name: Build jui-ui-vue (library)
        working-directory: jui-ui-vue
        run: |
          npm ci
          npm run build

      - name: Build jui-grid-vue (library, depends on jui-ui-vue)
        working-directory: jui-grid-vue
        run: |
          npm ci
          npm run build:lib

      - name: Build the site
        working-directory: site/web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
